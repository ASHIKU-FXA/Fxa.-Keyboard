workflows:

  android-debug:
    name: Android Debug APK
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      flutter: 3.22.0
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'dev'
          include: true
        - pattern: 'feature/*'
          include: true

    scripts:
      - name: Set up Flutter SDK
        script: |
          flutter --version
          flutter pub get

      - name: Run Flutter Analyzer
        script: |
          flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        script: |
          flutter test --reporter expanded

      - name: Build Debug APK
        script: |
          flutter build apk --debug --target lib/main.dart

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - ashikurfxa@gmail.com
        notify:
          success: true
          failure: true


  android-release-apk:
    name: Android Release APK (Signed)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.22.0
      java: 17
      android_signing:
        - mukto_keystore

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Set up Flutter SDK
        script: |
          flutter --version
          flutter pub get

      - name: Run Flutter Analyzer
        script: |
          flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        script: |
          flutter test --reporter expanded

      - name: Build Release APK
        script: |
          flutter build apk \
            --release \
            --target lib/main.dart \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
      - build/app/outputs/flutter-apk/app-x86_64-release.apk
      - build/debug-info/

    publishing:
      email:
        recipients:
          - ashikurfxa@gmail.com
        notify:
          success: true
          failure: true


  android-release-aab:
    name: Android Release AAB (Play Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.22.0
      java: 17
      android_signing:
        - mukto_keystore

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'release-*'
          include: true

    scripts:
      - name: Set up Flutter SDK
        script: |
          flutter --version
          flutter pub get

      - name: Run Flutter Analyzer
        script: |
          flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        script: |
          flutter test --reporter expanded

      - name: Build Release AAB
        script: |
          flutter build appbundle \
            --release \
            --target lib/main.dart \
            --obfuscate \
            --split-debug-info=build/debug-info

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/debug-info/

    publishing:
      email:
        recipients:
          - ashikurfxa@gmail.com
        notify:
          success: true
          failure: true
