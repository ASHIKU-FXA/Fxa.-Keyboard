workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Build
        script: |
          rm -rf android
          flutter create --platforms=android --org=com.mukto --project-name=mukto_keyboard --overwrite .
          flutter pub get
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk

    publishing:
      email:
        recipients:
          - ashikurfxa@gmail.com
        notify:
          success: true
          failure: true
